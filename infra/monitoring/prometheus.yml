global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: backend            # FastAPI /metrics
    metrics_path: /metrics
    static_configs: [{ targets: ["backend:8000"] }]

  - job_name: node              # host CPU / mem / disk
    static_configs: [{ targets: ["node-exporter:9100"] }]

  - job_name: postgres          # DB connections, tuples, locks
    static_configs: [{ targets: ["postgres-exporter:9187"] }]

  - job_name: cadvisor          # per-container CPU / mem
    static_configs: [{ targets: ["cadvisor:8080"] }]
