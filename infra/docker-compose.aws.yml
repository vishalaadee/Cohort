name: placement-poc

# Use this on the EC2 box when the database lives on RDS.
# Run with:  docker compose -f docker-compose.aws.yml up -d --build
#
# Differences from docker-compose.yml (local/dev):
#   - no "db" container — RDS is the database, reached over the VPC
#   - postgres-exporter points at RDS using the read-only "monitor" role
#     (never the app_user or the RDS master account)
#   - everything else (backend, caddy, minio, prometheus, grafana,
#     node-exporter, cadvisor) is unchanged

services:
  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@${RDS_HOST}:${RDS_PORT}/${RDS_DB}?sslmode=require
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      DEV_FALLBACK: ${DEV_FALLBACK}

      # --- outbound mail ---------------------------------------------------
      # These were hand-edited on the EC2 host and never committed, so any
      # clean redeploy (new instance, fresh clone, rebuild from git) silently
      # lost them and drive announcements stopped sending with no error.
      #
      # Defaults are deliberate. With SMTP_HOST empty, mailer.is_configured()
      # returns False and the app simply does not send — it still starts, and
      # publishing a drive succeeds with the announcement skipped rather than
      # the request failing. Fill these in .env to turn mail on.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Cohort}"
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-20}
      # Public base URL of this deployment. Not optional once mail is on:
      # the group-verification email builds its confirm link from this, and
      # an empty value yields a relative URL that no mail client can follow,
      # so notify_groups.verified_at is never set and publish_drive skips
      # announcing forever with no error. Existed only as a hand-edit on the
      # EC2 host until now.
      PORTAL_URL: ${PORTAL_URL:-}
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"   # bind to localhost only — reach it via SSH tunnel, never public

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"   # bind to localhost only — reach it via SSH tunnel, never public
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    expose:
      - "9100"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      # the read-only "monitor" role created by scripts/apply-schema-rds.sh —
      # holds pg_monitor only, cannot read a single row of student data.
      DATA_SOURCE_NAME: "postgresql://${MONITOR_DB_USER}:${MONITOR_DB_PASSWORD}@${RDS_HOST}:${RDS_PORT}/${RDS_DB}?sslmode=require"
    expose:
      - "9187"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"

volumes:
  minio-data:
  prom-data:
  grafana-data:
  caddy-data:
  caddy-config:
