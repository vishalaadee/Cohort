<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cohort — placement workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ===========================================================================
   Tokens. Neutrals are shared; the accent is set by data-role on <html>:
   admin = premium maroon, CR = green, student = gold, junior = deep blue.
   =========================================================================== */
:root{
  --paper:#07090A; --panel:#0F1214; --sunken:#0B0E0F; --raised:#141819;
  --ink:#E7EAEA; --ink-2:#99A2A4; --ink-3:#6A7375;
  --line:#1C2123; --line-2:#2A3134;
  --ok:#3ECF8E; --ok-soft:#0F241A;
  --warn:#D8A94A; --warn-soft:#241D0E;
  --bad:#E0726C; --bad-soft:#261513;
  --pro:#C8A451; --pro-soft:#221C0D;
  --acc:#A32D45; --acc-hi:#BE3A54; --acc-ink:#FFFFFF; --acc-soft:#2B0F16;
  --r:9px; --r-lg:13px;
}
:root[data-role="cr"]     {--acc:#33B36B;--acc-hi:#4FC77F;--acc-ink:#04140B;--acc-soft:#0D2317}
:root[data-role="student"]{--acc:#D4A937;--acc-hi:#E3BC55;--acc-ink:#15110A;--acc-soft:#241C09}
:root[data-role="junior"] {--acc:#4483DD;--acc-hi:#5E98EA;--acc-ink:#FFFFFF;--acc-soft:#0E1B2C}

:root[data-theme="light"]{
  --paper:#F6F6F5; --panel:#FFFFFF; --sunken:#EFEFEE; --raised:#FAFAF9;
  --ink:#15191A; --ink-2:#515A5C; --ink-3:#7C8486;
  --line:#E4E4E2; --line-2:#D3D4D1;
  --ok:#14794F; --ok-soft:#E4F1EA; --warn:#8E6314; --warn-soft:#F7EFDD;
  --bad:#A83A33; --bad-soft:#F8E8E6; --pro:#8A6A17; --pro-soft:#F6EFDC;
  --acc:#7B1E33; --acc-hi:#64182A; --acc-ink:#FFFFFF; --acc-soft:#F7E9EC;
}
:root[data-theme="light"][data-role="cr"]     {--acc:#1E7A46;--acc-hi:#156337;--acc-ink:#FFFFFF;--acc-soft:#E5F2EA}
:root[data-theme="light"][data-role="student"]{--acc:#8A6A12;--acc-hi:#70560D;--acc-ink:#FFFFFF;--acc-soft:#F8F0D9}
:root[data-theme="light"][data-role="junior"] {--acc:#1F4FA0;--acc-hi:#173F85;--acc-ink:#FFFFFF;--acc-soft:#E7EEF9}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
h2{font-size:15.5px;font-weight:600;margin:0}
h3{font-size:14px;font-weight:600;margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------------- login ---------------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .left{background:var(--panel);border-right:1px solid var(--line);padding:48px 44px;display:flex;flex-direction:column;gap:26px;justify-content:space-between}
.login .left h1{font-size:34px;line-height:1.22;letter-spacing:-.03em}
.login .left h1 em{font-style:normal;color:var(--acc)}
.login .left .sub{color:var(--ink-2);font-size:16px;margin-top:12px;max-width:40ch}
.login .left .foot{color:var(--ink-3);font-size:13px}
.login .right{display:grid;place-items:center;padding:32px 24px}
.login .box{width:100%;max-width:392px}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:16px}
.brand .mk{width:19px;height:19px;border-radius:6px;background:var(--acc);flex:none;position:relative}
.brand .mk::after{content:"";position:absolute;right:3px;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--pro)}
.ltabs{display:flex;gap:3px;background:var(--sunken);border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:20px}
.ltabs button{flex:1;border:0;background:transparent;padding:7px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--ink-2)}
.ltabs button.on{background:var(--panel);color:var(--ink);font-weight:600}
label{display:block;font-size:13px;font-weight:500;margin:14px 0 5px;color:var(--ink-2)}
input,select,textarea{width:100%;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:8px;padding:9px 11px;font:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
textarea{min-height:84px;resize:vertical}
.divider{text-align:center;color:var(--ink-3);font-size:12px;margin:16px 0}
.err{display:none;color:var(--bad);font-size:13px;margin-top:10px}
.err.show{display:block}

/* ---------------- shell ---------------- */
.shell{display:flex;min-height:100vh}
.rail{width:194px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:16px 11px;display:flex;flex-direction:column;gap:2px}
.rail .brand{padding:2px 8px 16px}
.rgrp{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:13px 9px 4px}
.rail a.nav{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:var(--ink-2);font-size:14px}
.rail a.nav:hover{background:var(--sunken);color:var(--ink)}
.rail a.nav.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.rail a.nav .ct{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.rail a.nav.on .ct{color:var(--acc)}
.rfoot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.rfoot .who{font-size:12.5px;color:var(--ink-3);padding:0 9px}
.rfoot .who b{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.rfoot .row{display:flex;gap:6px;padding:0 5px}
.tt{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:1}
.tt button{flex:1;border:0;background:var(--panel);padding:4px;cursor:pointer;font-size:12px;color:var(--ink-3);border-right:1px solid var(--line)}
.tt button:last-child{border-right:0}
.tt button.on{background:var(--acc-soft);color:var(--acc);font-weight:600}

main{flex:1 1 auto;min-width:0;padding:24px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.head .sub{color:var(--ink-3);font-size:14px;margin-top:2px}
.head .rt{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.back{font-size:13.5px;color:var(--ink-3)}
.back:hover{color:var(--acc)}

/* ---------------- primitives ---------------- */
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.btn:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.btn-p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn-p:hover:not(:disabled){background:var(--acc-hi);border-color:var(--acc-hi);color:var(--acc-ink)}
.btn-s{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:5px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.acc{background:var(--acc-soft);color:var(--acc)}
.tag.pro{background:var(--pro-soft);color:var(--pro)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.list{display:flex;flex-direction:column}
.ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ch .rt{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cb{padding:16px}
.quiet{font-size:13.5px;color:var(--ink-3);line-height:1.6}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 3px}
.tabs button{border:0;background:transparent;padding:9px 12px;font-size:14px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.filters{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.filters button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.filters button:hover{background:var(--sunken)}
.filters button.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow select,.frow input{width:auto;min-width:150px}
.search{width:100%}
.row{display:flex;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .bd{flex:1 1 auto;min-width:0}
.row .t{font-size:14.5px;font-weight:500}
.row .d{font-size:13px;color:var(--ink-3);margin-top:2px}
.row .rt{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.off{background:var(--raised);opacity:.85}
.mx{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.mx .m{flex:1 1 145px;padding:13px 15px;border-right:1px solid var(--line);min-width:0}
.mx .m:last-child{border-right:0}
.mx .k{font-size:12px;color:var(--ink-3)}
.mx .v{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:1px}
.mx .d{font-size:12.5px;color:var(--ink-3)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:500;padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 16px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--raised)}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.tf{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.tf .rt{margin-left:auto;display:flex;gap:6px}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--acc);cursor:pointer;margin:0;flex:none}
.sw{position:relative;width:35px;height:20px;flex:none;display:block}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw i{position:absolute;inset:0;background:var(--line-2);border-radius:99px;transition:.15s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:.15s}
.sw input:checked + i{background:var(--acc)}
.sw input:checked + i::after{transform:translateX(15px)}
.code{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.06em;background:var(--sunken);border:1px solid var(--line-2);border-radius:6px;padding:3px 9px}
.bars{display:flex;flex-direction:column;gap:8px;padding:16px}
.bar{display:grid;grid-template-columns:130px 1fr auto;gap:11px;align-items:center}
.bar .l{font-size:13.5px}
.bar .t{height:7px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar .f{height:100%;background:var(--acc);border-radius:99px}
.bar .v{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);min-width:96px;text-align:right}
.bar .v span{color:var(--ink-3)}
.strip{display:flex;align-items:center;gap:3px;margin-top:6px}
.sg{min-width:29px;height:20px;padding:0 5px;border-radius:4px;background:var(--sunken);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-2)}
.sg.on{background:var(--acc-soft);color:var(--acc)}
.sg.z{opacity:.45}
.legend{display:flex;align-items:center;gap:3px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--raised)}
.legend span{min-width:29px;padding:0 5px;text-align:center;font-size:10.5px;color:var(--ink-3)}
.legend .lb{min-width:0;padding:0;margin-right:8px;font-size:12px;color:var(--ink-3)}
.bulk{display:flex;align-items:center;gap:9px;padding:8px 16px;background:var(--acc-soft);border-bottom:1px solid var(--line);font-size:13.5px;color:var(--acc);flex-wrap:wrap}
.bulk .rt{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.bulk .btn{background:var(--panel);border-color:transparent}
.why{margin-top:8px;border-left:2px solid var(--line-2);padding:1px 0 1px 12px}
.why .h{font-size:13px;color:var(--ink-3)}
.why ul{margin:3px 0 0;padding-left:15px;display:flex;flex-direction:column;gap:2px}
.why li{font-size:14px;color:var(--ink-2)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:3px 14px;padding:14px 16px}
.col{display:flex;gap:9px;align-items:center;font-size:13.5px;padding:3px 0}
.col input{margin:0}
.empty{padding:34px 18px;text-align:center;color:var(--ink-3)}
.empty .t{font-weight:600;color:var(--ink-2);font-size:14.5px}
.spin{padding:30px;text-align:center;color:var(--ink-3);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);background:var(--panel);border:1px solid var(--line-2);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px;z-index:80}
.modal .box{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);width:100%;max-width:520px;max-height:88vh;overflow:auto}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh .x{margin-left:auto;border:0;background:transparent;cursor:pointer;color:var(--ink-3);font-size:18px;line-height:1}
.modal .mb{padding:18px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line)}

@media (max-width:880px){
  .login{grid-template-columns:1fr}
  .login .left{display:none}
  .shell{flex-direction:column}
  .rail{width:auto;flex-direction:row;align-items:center;gap:3px;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .rail .brand{padding:0 10px 0 2px}
  .rgrp,.rfoot{display:none}
  .rail a.nav{white-space:nowrap;padding:6px 10px}
  main{padding:16px 14px}
  .row{flex-direction:column;align-items:flex-start;gap:10px}
  .bar{grid-template-columns:92px 1fr auto}
  .legend{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ==========================================================================
   Core — kept compatible with the previous app.html: same localStorage keys,
   same api() contract, same error envelope handling.
   ========================================================================== */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const root=$("#root");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let AUTH=JSON.parse(localStorage.getItem("cohort_auth")||"null");
let CFG={google_client_id:null};
let ENT={};                       // entitlements: {feature: bool}
let BUCKETS=[];                   // college's buckets
const THEME_KEY="cohort_theme";

function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem(THEME_KEY,t);
  $$(".tt button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));}
function uiRole(){
  if(!AUTH)return "admin";
  if(AUTH.role==="sub_admin")return "cr";
  if(["owner","admin"].includes(AUTH.role))return "admin";
  return AUTH.is_final_year===false?"junior":"student";
}
function applyRole(){document.documentElement.dataset.role=uiRole();}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),3200);}
function saveAuth(a){AUTH=a;localStorage.setItem("cohort_auth",JSON.stringify(a));applyRole();}
function signOut(){localStorage.removeItem("cohort_auth");AUTH=null;ENT={};BUCKETS=[];location.hash="#/login";render();}

class ApiError extends Error{
  constructor(message,{status=0,code="request_failed",fields={}}={}){
    super(message);this.name="ApiError";this.status=status;this.code=code;this.fields=fields;}
}
const STATUS_MESSAGE={400:"Check the information and try again.",401:"Sign in to continue.",
  403:"You do not have permission to do that.",404:"We could not find that item.",
  409:"This action conflicts with the current information.",422:"Check the highlighted fields.",
  429:"Too many attempts. Please wait a few minutes and try again.",
  500:"Something went wrong on our side. Please try again.",
  503:"The service is being updated. Please try again shortly."};
function errorFromResponse(data,status){
  const err=data&&typeof data.error==="object"?data.error:null;
  if(err)return new ApiError(typeof err.message==="string"?err.message:(STATUS_MESSAGE[status]||"We could not complete that request."),
    {status,code:err.code,fields:err.fields&&typeof err.fields==="object"?err.fields:{}});
  const legacy=data&&typeof data.detail==="string"?data.detail:null;
  return new ApiError(legacy||STATUS_MESSAGE[status]||"We could not complete that request.",{status});
}
const displayError=e=>e instanceof ApiError?e.message:"We could not complete that request. Check your connection and try again.";

async function api(path,opts={}){
  const headers={...(opts.headers||{})};
  if(AUTH?.token)headers["Authorization"]="Bearer "+AUTH.token;
  if(opts.body&&!(opts.body instanceof FormData))headers["Content-Type"]="application/json";
  let r;
  try{r=await fetch(path,{...opts,headers});}
  catch{throw new ApiError("We can’t reach Cohort right now. Check your connection and try again.",{code:"network_error"});}
  const d=await r.json().catch(()=>({}));
  if(!r.ok){
    const err=errorFromResponse(d,r.status);
    if(r.status===401&&AUTH){signOut();throw new ApiError("Your session expired — sign in again.",{status:401,code:"session_expired"});}
    throw err;
  }
  return d;
}
/* File downloads need the same auth header, so they go through fetch too. */
async function download(path,fallbackName){
  try{
    const r=await fetch(path,{headers:AUTH?.token?{Authorization:"Bearer "+AUTH.token}:{}});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw errorFromResponse(d,r.status);}
    const blob=await r.blob();
    const cd=r.headers.get("Content-Disposition")||"";
    const m=/filename="?([^"]+)"?/.exec(cd);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=m?m[1]:fallbackName;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast("Download started");
  }catch(e){toast(displayError(e));}
}

const money=v=>v==null?"—":"₹"+(Number(v)/100000).toFixed(1)+" LPA";
const fmtDate=d=>{if(!d)return "—";const x=new Date(d);return isNaN(x)?"—":
  x.toLocaleDateString(undefined,{day:"numeric",month:"short"});};
const RL={resume_screening:"Screening",online_assessment:"Online test",technical_1:"Tech 1",
  technical_2:"Tech 2",technical_3:"Tech 3",managerial:"Managerial",hr:"HR",final_placement:"Placed"};
const ROUNDS=Object.keys(RL);
const STATUS_LABEL={0:"Draft",1:"Open",2:"Closed"};
const isStaff=()=>AUTH&&["owner","admin","sub_admin"].includes(AUTH.role);
const isOfficer=()=>AUTH&&["owner","admin"].includes(AUTH.role);
const bucketLabel=k=>{const b=BUCKETS.find(x=>x.key===k);return b?b.label:(k||"—");};

/* Describes a placement policy in the officer's own words. Used by the
   Policy screen and by each drive's rules tab. */
function describePolicy(p){
  p=p||{};
  const bits=[];
  if(p.one_offer)bits.push("one offer per student");
  else if(p.max_offers)bits.push(`at most ${p.max_offers} offers`);
  const m=Number(p.multiplier)||1;
  if(p.upgrade==="multiplier")bits.push(`the next drive must pay at least ${m}× their current offer`);
  else if(p.upgrade==="higher_slab")bits.push("the next drive must be in a higher bucket");
  else if(p.upgrade==="both")bits.push(`the next drive must be in a higher bucket and pay at least ${m}× their current offer`);
  return bits.length?bits.join(" · "):"no restrictions set";
}


/* ==========================================================================
   Login
   ========================================================================== */
function LoginView(){
  applyRole();
  root.innerHTML=`
  <div class="login">
    <div class="left">

const spinner=`<div class="card"><div class="spin">Loading…</div></div>`;
const emptyCard=(t,d)=>`<div class="card"><div class="empty"><div class="t">${esc(t)}</div><div>${esc(d||"")}</div></div></div>`;
function errCard(e){return `<div class="card"><div class="empty"><div class="t">Couldn’t load this</div><div>${esc(displayError(e))}</div></div></div>`;}
function setView(html){const v=$("#view");if(v)v.innerHTML=html;}

/* small helper: render tabs and wire them without re-rendering the shell */
function tabBar(items,current,onPick){
  const id="tb"+Math.random().toString(36).slice(2,8);
  setTimeout(()=>{const el=document.getElementById(id);if(!el)return;
    el.querySelectorAll("button").forEach(b=>b.onclick=()=>onPick(b.dataset.k));},0);
  return `<div class="tabs" id="${id}">${items.map(([k,l,c])=>
    `<button type="button" data-k="${k}" class="${k===current?"on":""}">${esc(l)}${c?` <span class="quiet">${esc(c)}</span>`:""}</button>`).join("")}</div>`;
}
function modal(title,bodyHtml,onOk,okLabel){
  const wrap=document.createElement("div");
  wrap.className="modal";
  wrap.innerHTML=`<div class="box"><div class="mh"><h2>${esc(title)}</h2>
    <button class="x" type="button" aria-label="Close">✕</button></div>
    <div class="mb">${bodyHtml}</div>
    <div class="mf"><button class="btn" type="button" data-x>Cancel</button>
      <button class="btn btn-p" type="button" data-ok>${esc(okLabel||"Save")}</button></div></div>`;
  document.body.appendChild(wrap);
  const close=()=>wrap.remove();
  wrap.querySelector(".x").onclick=close;
  wrap.querySelector("[data-x]").onclick=close;
  wrap.onclick=e=>{if(e.target===wrap)close();};
  wrap.querySelector("[data-ok]").onclick=async()=>{
    const btn=wrap.querySelector("[data-ok]");btn.disabled=true;
    try{await onOk(wrap);close();}catch(e){toast(displayError(e));btn.disabled=false;}
  };
  return wrap;
}

      <div class="m"><div class="k">Applications</div><div class="v">${t.applications??0}</div><div class="d">${t.active??0} in process</div></div>

let driveFilter="open", driveQuery="", driveBucket="";
async function DrivesView(){
  Shell(spinner,"#/drives");
  try{
    const [drives]=await Promise.all([api("/api/companies")]);
    if(!BUCKETS.length)BUCKETS=await api("/api/buckets").catch(()=>[]);
    const counts={all:drives.length,open:drives.filter(d=>d.status===1).length,
      draft:drives.filter(d=>d.status===0).length,closed:drives.filter(d=>d.status===2).length};
    const q=driveQuery.trim().toLowerCase();
    const shown=drives.filter(d=>{
      if(driveFilter==="open"&&d.status!==1)return false;
      if(driveFilter==="draft"&&d.status!==0)return false;
      if(driveFilter==="closed"&&d.status!==2)return false;
      if(driveBucket&&d.category!==driveBucket)return false;
      if(q&&!(`${d.name} ${bucketLabel(d.category)}`.toLowerCase().includes(q)))return false;
      return true;
    });
    setView(`
    <div class="head"><div><h1>Drives</h1>
      <div class="sub">${counts.open} open · ${counts.draft} not published · ${counts.all} this year</div></div>
      ${isOfficer()?`<div class="rt"><button class="btn btn-p" id="newdrive" type="button">Add company / drive</button></div>`:""}</div>
    <input class="search" id="dq" type="search" placeholder="Search by company or bucket" value="${esc(driveQuery)}">
    <div class="card">
      <div class="ch">
        <div class="filters">
          ${[["open","Open",counts.open],["draft","Not published",counts.draft],
             ["closed","Closed",counts.closed],["all","All",counts.all]]
            .map(([k,l,c])=>`<button type="button" data-f="${k}" class="${driveFilter===k?"on":""}">${l} <span class="quiet">${c}</span></button>`).join("")}
        </div>
        <div class="rt"><select id="bq" style="width:auto"><option value="">All buckets</option>
          ${BUCKETS.map(b=>`<option value="${esc(b.key)}" ${driveBucket===b.key?"selected":""}>${esc(b.label)}</option>`).join("")}
        </select></div>
      </div>
      ${shown.length?`<div class="list">${shown.map(d=>`
        <div class="row">
          <div class="bd">
            <div class="t">${esc(d.name)} <span class="tag">${esc(bucketLabel(d.category))}</span>
              <span class="tag ${d.status===1?"ok":d.status===0?"warn":""}">${STATUS_LABEL[d.status]||"—"}</span></div>
            <div class="d">${money(d.package)} · ${d.registered||0} registered · ${d.placed||0} placed
              ${d.eligible_branches&&d.eligible_branches.length?" · "+esc(d.eligible_branches.join(", ")):""}</div>
          </div>
          <div class="rt">
            ${isOfficer()&&d.status===0?`<button class="btn btn-p btn-s" data-pub="${d.id}" type="button">Publish</button>`:""}
            <a class="btn btn-s" href="#/drive/${d.id}">Open</a>
          </div>
        </div>`).join("")}</div>`
      :`<div class="empty"><div class="t">Nothing here</div><div>Try a different filter or search.</div></div>`}
    </div>`);
    $$("[data-f]").forEach(b=>b.onclick=()=>{driveFilter=b.dataset.f;DrivesView();});
    $("#bq").onchange=e=>{driveBucket=e.target.value;DrivesView();};
    const dq=$("#dq");
    dq.oninput=e=>{driveQuery=e.target.value;clearTimeout(dq._t);dq._t=setTimeout(DrivesView,220);};
    $$("[data-pub]").forEach(b=>b.onclick=()=>publishDrive(b.dataset.pub));
    const nd=$("#newdrive");if(nd)nd.onclick=addDriveModal;
    if(driveQuery){dq.focus();dq.setSelectionRange(dq.value.length,dq.value.length);}
  }catch(e){setView(errCard(e));}
}

/* ==========================================================================
   One drive. Companies and drives are the same record — this is the only
   place a drive is inspected, and every tab renders in a single pass so
   the tab handlers are never wired to a detached element.
   ========================================================================== */
let driveTab="students", picked=new Set();
async function DriveView(id){
  Shell(spinner,"#/drives");
  picked=new Set();
  try{
    if(!BUCKETS.length)BUCKETS=await api("/api/buckets").catch(()=>[]);
    const d=await api(`/api/companies/${id}/details`);
    const tabs=[["students","Students"],["details","Details"]];
    if(isOfficer())tabs.push(["rules","Who can apply"],["downloads","Downloads"],["emails","Emails"]);

    const draw=async()=>{
      let body="",wire=null;
      try{
        if(driveTab==="students"){const r=await api(`/api/admin/companies/${id}/registrations`);
          body=studentsTab(r);wire=()=>wireStudents(id);}
        else if(driveTab==="details"){const r=await api(`/api/admin/companies/${id}/registrations`).catch(()=>[]);
          body=detailsTab(d,r);wire=()=>wireDetails(id,d,draw);}
        else if(driveTab==="rules"){const p=await api("/api/admin/policy").catch(()=>({}));
          body=rulesTab(d,p);wire=()=>wireRules(id,d,draw);}
        else if(driveTab==="downloads"){const m=await api("/api/export/columns");
          body=downloadsTab(m);wire=()=>wireDownloads(id,m,draw);}
        else{const log=await api(`/api/companies/${id}/notifications`).catch(()=>[]);
          body=emailsTab(d,log);wire=()=>wireEmails(id);}
      }catch(e){body=errCard(e);}

      const head=`<div class="head"><div><a class="back" href="#/drives">← All drives</a>
        <h1 style="margin-top:3px">${esc(d.name)}</h1>
        <div class="sub">${esc(bucketLabel(d.category))} · ${money(d.package)} · ${STATUS_LABEL[d.status]}
          ${d.role_title?" · "+esc(d.role_title):""}</div></div>
        <div class="rt">
          ${isOfficer()&&d.status===0?`<button class="btn btn-p" id="pub" type="button">Publish</button>`:""}
          ${isOfficer()&&d.status===1?`<button class="btn" id="remind" type="button">Send test reminder</button>`:""}
        </div></div>`;
      setView(head+tabBar(tabs,driveTab,k=>{driveTab=k;picked=new Set();draw();})+body);

      const p=$("#pub");if(p)p.onclick=()=>publishDrive(id);
      const r=$("#remind");if(r)r.onclick=async()=>{
        r.disabled=true;
        try{const res=await api(`/api/companies/${id}/test-reminder`,{method:"POST"});
          toast(res.sent?`Reminder sent to ${res.recipients} student${res.recipients===1?"":"s"}`
                        :"Already sent today — not sending again");}
        catch(e){toast(displayError(e));}finally{r.disabled=false;}};
      if(wire)wire();
    };
    await draw();
  }catch(e){setView(errCard(e));}
}

/* ------------------------------- students ------------------------------- */
function studentsTab(regs){
  if(!regs.length)return emptyCard("Nobody has registered yet",
    "Students see this drive once it is published and they meet the conditions.");
  const groups={};
  regs.forEach(r=>{(groups[r.current_round]=groups[r.current_round]||[]).push(r);});
  return `
  <div class="card">
    <div class="bulk" id="bulkbar" style="display:none">
      <span id="bulkn">0 selected</span>

function wireStudents(id){
  const boxes=$$(".pick"),bar=$("#bulkbar"),n=$("#bulkn");
  if(!boxes.length)return;
  const sync=()=>{picked=new Set(boxes.filter(b=>b.checked).map(b=>Number(b.value)));
    if(bar){bar.style.display=picked.size?"":"none";n.textContent=`${picked.size} selected`;}};
  boxes.forEach(b=>b.onchange=sync);
  const sa=$("#selall");if(sa)sa.onchange=()=>{boxes.forEach(b=>b.checked=sa.checked);sync();};
  const send=async payload=>{
    if(!picked.size)return toast("Select at least one student");
    try{const r=await api("/api/applications/bulk",{method:"PATCH",
      body:JSON.stringify({ids:[...picked],...payload})});
      toast(`Updated ${r.updated} student${r.updated===1?"":"s"}`);
      DriveView(id);
    }catch(e){toast(displayError(e));}
  };
  const go=$("#bulkgo");if(go)go.onclick=()=>send({current_round:$("#bulkround").value});
  const rej=$("#bulkrej");if(rej)rej.onclick=()=>send({status:"rejected"});
  const pl=$("#bulkplace");if(pl)pl.onclick=()=>send({status:"placed",current_round:"final_placement"});
}

const OPTEXT={">=":"at least","<=":"at most",">":"more than","<":"less than",
  "==":"exactly","!=":"not","in":"one of","not_in":"not one of","between":"between"};

function wireRules(id,d,redraw){
  const tree=d.eligibility_rules||{};
  const list=Array.isArray(tree.all)?tree.all.slice():[];
  const persist=async()=>{
    await api(`/api/admin/companies/${id}/rules`,{method:"PUT",
      body:JSON.stringify({eligibility_rules:list.length?{all:list}:{}})});
    d.eligibility_rules=list.length?{all:list}:{};
  };
  $$("[data-del]").forEach(b=>b.onclick=async()=>{
    list.splice(Number(b.dataset.del),1);
    try{await persist();toast("Condition removed");redraw();}catch(e){toast(displayError(e));}});
  const add=$("#addcond");
  if(add)add.onclick=()=>{
    const body=`
      <label for="c-field">Field</label>
      <select id="c-field"><option value="cgpa">CGPA</option><option value="backlogs">Backlogs</option>
        <option value="branch">Branch</option><option value="gender">Gender</option>
        <option value="tenth_pct">10th %</option><option value="twelfth_pct">12th %</option></select>
      <label for="c-op">Condition</label>
      <select id="c-op"><option value="&gt;=">at least</option><option value="&lt;=">at most</option>
        <option value="==">exactly</option><option value="in">one of</option></select>
      <label for="c-val">Value</label>
      <input id="c-val" placeholder="7.0 — or for “one of”: CSE, ISE, ECE">
      <p class="quiet" style="margin-top:10px">A student who doesn't qualify is told exactly which condition they missed,
      in these words. Keep the wording something you'd be happy for them to read.</p>`;
    modal("Add a condition",body,async w=>{
      const field=w.querySelector("#c-field").value;
      const op=w.querySelector("#c-op").value;
      const raw=w.querySelector("#c-val").value.trim();
      if(!raw)throw new ApiError("Enter a value.");
      const LABELS={cgpa:"CGPA",backlogs:"Backlogs",branch:"Branch",gender:"Gender",
        tenth_pct:"10th %",twelfth_pct:"12th %"};
      let value=raw;
      if(op==="in")value=raw.split(",").map(s=>s.trim()).filter(Boolean);
      else if(raw!==""&&!isNaN(Number(raw)))value=Number(raw);
      list.push({field,op,value,label:LABELS[field]||field});
      await persist();toast("Condition added");redraw();
    },"Add");
  };
  const pv=$("#preview");
  if(pv)pv.onclick=async()=>{
    try{const r=await api(`/api/admin/companies/${id}/eligibility-preview`);
      toast(`${r.eligible} of ${r.total} students qualify`);}catch(e){toast(displayError(e));}};
  const sc=$("#setcustom");
  if(sc)sc.onclick=()=>modal("Customise offer rules for this drive",
    `<p class="quiet">Your central policy already applies to every drive. Only change this if this company asked for something different.</p>
     <label for="cp-up" style="margin-top:12px">Who may sit if they already have an offer?</label>
     <select id="cp-up"><option value="none">Anyone</option>
       <option value="multiplier">Only if this drive pays N× their current offer</option>
       <option value="higher_slab">Only if this drive is in a higher bucket</option>
       <option value="both">Both conditions</option></select>
     <label for="cp-m">Multiplier</label><input id="cp-m" type="number" min="1" step="0.1" value="1.5">
     <label for="cp-r">Why (recorded)</label><input id="cp-r" placeholder="e.g. Company asked for a wider pool">`,
    async w=>{
      await api(`/api/companies/${id}/details`,{method:"PATCH",body:JSON.stringify({custom_policy:{
        upgrade:w.querySelector("#cp-up").value,
        multiplier:Number(w.querySelector("#cp-m").value)||1,
        reason:w.querySelector("#cp-r").value.trim()}})});
      toast("Customised for this drive");DriveView(id);},"Save");
  const cc=$("#clearcustom");
  if(cc)cc.onclick=async()=>{
    try{await api(`/api/companies/${id}/details`,{method:"PATCH",body:JSON.stringify({custom_policy:null})});
      toast("Back to the college policy");DriveView(id);}catch(e){toast(displayError(e));}};
}

    </div>`);

    <div class="head"><div><h1>Hello${profile.full_name?", "+esc(profile.full_name.split(" ")[0]):""}</h1>
      <div class="sub">${esc(profile.roll_no||"")}${profile.branch?" · "+esc(profile.branch):""}${profile.cgpa!=null?" · CGPA "+profile.cgpa:""}</div></div></div>
    ${todo.length?`<div class="card"><div class="ch"><h2>To do</h2><span class="tag warn">${todo.length}</span></div>
      <div class="list">${todo.map(([t,d,h])=>`<div class="row"><div class="bd"><div class="t">${esc(t)}</div>
        <div class="d">${esc(d)}</div></div><div class="rt"><a class="btn btn-p btn-s" href="${h}">Open</a></div></div>`).join("")}</div></div>`:""}
    <div class="mx">
      <div class="m"><div class="k">Applied</div><div class="v">${apps.length}</div><div class="d">drives</div></div>
      <div class="m"><div class="k">In process</div><div class="v">${apps.filter(a=>a.status==="active").length}</div><div class="d">still running</div></div>
      <div class="m"><div class="k">Offers</div><div class="v">${apps.filter(a=>a.status==="placed").length}</div><div class="d">—</div></div>
    </div>
    ${apps.length?`<div class="card"><div class="ch"><h2>Your applications</h2></div><div class="list">
      ${apps.map(a=>`<div class="row"><div class="bd"><div class="t">${esc(a.company)}</div>
        <div class="d">${money(a.package)} · ${esc(RL[a.current_round]||a.current_round)}</div></div>
        <div class="rt"><span class="tag ${a.status==="placed"?"ok":a.status==="rejected"?"bad":""}">${esc(a.status)}</span></div></div>`).join("")}
    </div></div>`:emptyCard("You haven't applied anywhere yet","Open Drives to see what you're eligible for.")}`);
  }catch(e){setView(errCard(e));}
}

let myQuery="",myBucket="",showBlocked=false;
async function StudentDrives(){
  Shell(spinner,"#/drives");
  try{
    if(!BUCKETS.length)BUCKETS=await api("/api/buckets").catch(()=>[]);
    const all=await api("/api/me/drives");
    const open=all.filter(d=>d.status===1);
    const q=myQuery.trim().toLowerCase();
    const match=d=>(!q||`${d.name} ${bucketLabel(d.category)}`.toLowerCase().includes(q))
      &&(!myBucket||d.category===myBucket);
    const eligible=open.filter(d=>d.eligible&&match(d));
    const blocked=open.filter(d=>!d.eligible&&match(d));
    setView(`
    <div class="head"><div><h1>Drives</h1>
      <div class="sub">${eligible.length} you can apply to, of ${open.length} open</div></div></div>
    <input class="search" id="mq" type="search" placeholder="Search by company name" value="${esc(myQuery)}">
    <div class="frow">
      <select id="mb" style="width:auto"><option value="">All buckets</option>
        ${BUCKETS.map(b=>`<option value="${esc(b.key)}" ${myBucket===b.key?"selected":""}>${esc(b.label)}</option>`).join("")}</select>
      <label class="col" for="sb" style="margin-left:auto"><input type="checkbox" id="sb" ${showBlocked?"checked":""}>
        Also show drives I can't apply to (${blocked.length})</label>
    </div>
    <div class="card"><div class="ch"><h2>You can apply</h2><span class="tag ok">${eligible.length}</span></div>
      ${eligible.length?`<div class="list">${eligible.map(d=>`
        <div class="row"><div class="bd"><div class="t">${esc(d.name)} <span class="tag">${esc(bucketLabel(d.category))}</span></div>
          <div class="d">${money(d.package)}</div></div>
        <div class="rt"><button class="btn btn-p btn-s" data-reg="${d.id}" type="button">Apply</button></div></div>`).join("")}</div>`
      :`<div class="empty"><div class="t">Nothing open for you right now</div>
        <div>${blocked.length?"Tick the box above to see the drives you're not eligible for, and why.":"Check back when the next drive is published."}</div></div>`}
    </div>
    ${showBlocked&&blocked.length?`<div class="card"><div class="ch"><h2>You can't apply</h2><span class="tag">${blocked.length}</span></div>
      <div class="list">${blocked.map(d=>`<div class="row"><div class="bd">
        <div class="t">${esc(d.name)} <span class="tag">${esc(bucketLabel(d.category))}</span></div>
        <div class="d">${money(d.package)}</div>
        ${d.reasons&&d.reasons.length?`<div class="why"><div class="h">Why not</div>
          <ul>${d.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`:""}</div>
        <div class="rt"><button class="btn btn-s" disabled type="button">Apply</button></div></div>`).join("")}</div>
    </div>`:""}`);
    const mq=$("#mq");
    mq.oninput=e=>{myQuery=e.target.value;clearTimeout(mq._t);mq._t=setTimeout(StudentDrives,220);};
    if(myQuery){mq.focus();mq.setSelectionRange(mq.value.length,mq.value.length);}
    $("#mb").onchange=e=>{myBucket=e.target.value;StudentDrives();};
    $("#sb").onchange=e=>{showBlocked=e.target.checked;StudentDrives();};
    $$("[data-reg]").forEach(b=>b.onclick=async()=>{
      b.disabled=true;
      try{const r=await api(`/api/me/register/${b.dataset.reg}`,{method:"POST"});
        toast(`Applied to ${r.drive}`);StudentDrives();}
      catch(e){toast(displayError(e));b.disabled=false;}});
  }catch(e){setView(errCard(e));}
}

async function ExperiencesView(){
  Shell(spinner,"#/experiences");
  try{
    const rows=await api("/api/me/feedback");
    const D=["","Easy","Easy","Medium","Hard","Very hard"];
    setView(`
    <div class="head"><div><h1>Interview experiences</h1>
      <div class="sub">${rows.length} written by students who sat these drives</div></div>
      ${uiRole()==="student"?`<div class="rt"><button class="btn btn-p" id="addxp" type="button">Write yours</button></div>`:""}</div>
    ${rows.length?`<div class="card"><div class="list">${rows.map(f=>`
      <div class="row"><div class="bd">
        <div class="t">${esc(f.company)}${f.role?" · "+esc(f.role):""}
          ${f.difficulty?`<span class="tag ${f.difficulty>=4?"bad":f.difficulty===3?"warn":"ok"}">${esc(D[f.difficulty]||"")}</span>`:""}</div>
        <div class="d">${f.rounds?esc(f.rounds)+" — ":""}${esc(f.topics||"")}${f.tips?"<br>"+esc(f.tips):""}</div>
      </div></div>`).join("")}</div></div>`
    :emptyCard("Nothing here yet","Once seniors write about their interviews, it shows up here.")}`);
    const add=$("#addxp");
    if(add)add.onclick=async()=>{
      let apps=[];
      try{apps=await api("/api/me/applications");}catch{}
      const placed=apps.filter(a=>a.status==="placed");
      if(!placed.length)return toast("You can write an experience once an offer is recorded");
      const body=`<label for="x-co">Which company?</label>
        <select id="x-co">${placed.map(a=>`<option value="${a.id}" data-c="${esc(a.company)}">${esc(a.company)}</option>`).join("")}</select>
        <label for="x-role">Role</label><input id="x-role" placeholder="e.g. Software Engineer">
        <label for="x-rounds">Rounds you went through</label><input id="x-rounds" placeholder="OA + 2 tech + HR">
        <label for="x-diff">How hard was it?</label>
        <select id="x-diff"><option value="1">1 — easy</option><option value="2">2</option>
          <option value="3" selected>3 — medium</option><option value="4">4</option><option value="5">5 — very hard</option></select>
        <label for="x-topics">Topics they asked</label><input id="x-topics" placeholder="DP, graphs, SQL">
        <label for="x-tips">Advice for juniors</label><textarea id="x-tips"></textarea>`;
      modal("Write your interview experience",body,async wrap=>{
        const sel=wrap.querySelector("#x-co");
        const app=apps.find(a=>String(a.id)===sel.value);
        await api("/api/me/feedback",{method:"POST",body:JSON.stringify({
          company_id:app?app.company_id:null,
          role:wrap.querySelector("#x-role").value.trim(),
          rounds:wrap.querySelector("#x-rounds").value.trim(),
          difficulty:Number(wrap.querySelector("#x-diff").value),
          topics:wrap.querySelector("#x-topics").value.trim(),
          tips:wrap.querySelector("#x-tips").value.trim()})});
        toast("Thank you — juniors will see this");ExperiencesView();},"Post");
    };
  }catch(e){setView(errCard(e));}
}

async function ProfileView(){
  Shell(spinner,"#/profile");
  try{
    const p=await api("/api/me/profile");
    const c=await api("/api/me/consent").catch(()=>({}));
    const consentOn=!!(c.consent_recruiter_share??c.consent??c.enabled??false);
    setView(`
    <div class="head"><div><h1>My details</h1>
      <div class="sub">${esc(p.full_name||"")} · ${esc(p.roll_no||"")}${p.branch?" · "+esc(p.branch):""}</div></div></div>
    <div class="card"><div class="list">
      <div class="row"><div class="bd"><div class="t">CGPA</div><div class="d">${p.cgpa??"—"} · from your college records</div></div>
        <div class="rt"><button class="btn btn-s" data-fix="cgpa" type="button">Ask to correct</button></div></div>
      <div class="row"><div class="bd"><div class="t">Backlogs</div><div class="d">${p.backlogs??0}</div></div>
        <div class="rt"><button class="btn btn-s" data-fix="backlogs" type="button">Ask to correct</button></div></div>
      <div class="row"><div class="bd"><div class="t">Resume</div>
        <div class="d">${p.has_resume?"On file":"Not uploaded — you can't apply to any drive without one"}</div></div>
        <div class="rt"><button class="btn ${p.has_resume?"":"btn-p"} btn-s" id="upres" type="button">${p.has_resume?"Replace":"Upload"}</button></div></div>
    </div></div>
    <div class="card"><div class="ch"><h2>Who can see you</h2></div><div class="list">
      <div class="row"><div class="bd"><div class="t">Your college</div>
        <div class="d">Always sees your marks, applications and placement status</div></div>
        <div class="rt"><span class="quiet">Always</span></div></div>
      <div class="row"><div class="bd"><div class="t">Companies at your college's drives</div>
        <div class="d">See your resume and details for drives you applied to</div></div>
        <div class="rt"><span class="quiet">On applying</span></div></div>
      <div class="row"><div class="bd"><div class="t">Anyone outside your college</div>
        <div class="d">Off by default. If you turn this on you can turn it off again at any time.</div></div>
        <div class="rt"><label class="sw" for="cs"><input type="checkbox" id="cs" ${consentOn?"checked":""}><i></i></label></div></div>
    </div>
    <div class="cb" style="border-top:1px solid var(--line)">
      <p class="quiet">Your college turning on a Pro feature does not turn this on. Only you can.</p></div>
    </div>`);
    $$("[data-fix]").forEach(b=>b.onclick=()=>modal(`Ask to correct your ${b.dataset.fix}`,
      `<label for="rv">What should it be?</label><input id="rv">
       <label for="rn">Why (optional)</label><input id="rn" placeholder="e.g. semester results updated">`,
      async wrap=>{const requested_value=wrap.querySelector("#rv").value.trim();
        if(!requested_value)throw new ApiError("Enter the correct value.");
        await api("/api/me/edit-request",{method:"POST",body:JSON.stringify({
          field:b.dataset.fix,requested_value,note:wrap.querySelector("#rn").value.trim()})});
        toast("Sent to your placement officer");},"Send"));
    $("#upres").onclick=()=>{
      const input=document.createElement("input");
      input.type="file";input.accept="application/pdf";
      input.onchange=async()=>{
        const f=input.files[0];if(!f)return;
        if(f.type!=="application/pdf")return toast("Upload a PDF");
        const fd=new FormData();fd.append("file",f);
        try{await api("/api/me/resume",{method:"POST",body:fd});toast("Resume uploaded");ProfileView();}
        catch(e){toast(displayError(e));}};
      input.click();};
    $("#cs").onchange=async e=>{
      try{await api("/api/me/consent",{method:"POST",body:JSON.stringify({consent:e.target.checked})});
        toast(e.target.checked?"Recruiters outside your college can now find you":"Turned off");}
      catch(err){toast(displayError(err));e.target.checked=!e.target.checked;}};
  }catch(e){setView(errCard(e));}
}

async function QAView(){

      <div class="rt"><button class="btn btn-p" id="ask" type="button">Ask</button></div></div>

      <div class="row"><div class="bd"><div class="t">${esc(q.title)}</div>
        <div class="d">${esc(q.body||"")}${q.answer?`<br><b>Answer:</b> ${esc(q.answer)}`:""}</div></div>
      <div class="rt"><span class="tag ${q.status==="answered"?"ok":"warn"}">${esc(q.status)}</span></div></div>`).join("")}</div></div>`
    :emptyCard("No questions yet","Ask anything about eligibility, dates or the process.")}`);

/* ==========================================================================
   Router
   ========================================================================== */
const ROUTES={
  "#/login":LoginView,
  "#/today":TodayView,"#/drives":()=>isStaff()?DrivesView():StudentDrives(),
  "#/students":StudentsView,"#/policy":PolicyView,"#/planner":PlannerView,
  "#/analytics":AnalyticsView,"#/inbox":InboxView,"#/settings":SettingsView,
  "#/juniors":JuniorsView,
  "#/home":StudentHome,"#/experiences":ExperiencesView,"#/profile":ProfileView,
  "#/qa":QAView,"#/premium":PremiumView,
};
function route(){
  let h=location.hash||"";
  if(!AUTH){LoginView();return;}
  const drive=/^#\/drive\/(\d+)/.exec(h);
  if(drive&&isStaff()){
    const tabParam=/tab=([a-z]+)/.exec(h);
    if(tabParam)driveTab=tabParam[1];
    DriveView(drive[1]);return;
  }
  h=h.split("?")[0];
  const allowed=NAV[uiRole()].flatMap(([,items])=>items.map(i=>i[0]));
  if(!ROUTES[h]||!allowed.includes(h))h=allowed[0];
  ROUTES[h]();
}
async function enterApp(){
  applyRole();
  if(AUTH&&["student","alumni"].includes(AUTH.role)){
    try{const ctx=await api("/api/me/context");AUTH.is_final_year=ctx.is_final_year;}
    catch{AUTH.is_final_year=true;}
  }
  applyRole();
  try{ENT=await api("/api/entitlements");}catch{ENT={};}
  try{BUCKETS=await api("/api/buckets");}catch{BUCKETS=[];}
  if(!location.hash||location.hash==="#/login"){
    location.hash=NAV[uiRole()][0][1][0][0];
  }
  route();
}
window.addEventListener("hashchange",route);
(async function boot(){
  applyTheme(localStorage.getItem(THEME_KEY)||"dark");
  try{CFG=await api("/api/auth/config");}catch{}
  if(AUTH){
    try{
      const me=await api("/api/auth/me");
      AUTH={...AUTH,...me};localStorage.setItem("cohort_auth",JSON.stringify(AUTH));
      await enterApp();
    }catch(e){
      if(e instanceof ApiError&&e.status===401){/* signOut already ran */}
      else{applyRole();route();}
    }
  }else{LoginView();}
})();
</script>
