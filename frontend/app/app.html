<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cohort — your placement workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root, :root[data-theme=light]{
  --bg:#F5F6FC; --panel:#FFFFFF; --panel2:#FAFBFF; --ink:#12172E; --mut:#5E6684;
  --line:#E6E9F5; --line2:#D4D9EC;
  --acc:#6C5CF7; --acc-hi:#5A49F0; --acc-ink:#fff; --acc-soft:rgba(108,92,247,.10);
  --mint:#10B981; --mint-soft:rgba(16,185,129,.12);
  --amber:#E8A23B; --amber-soft:rgba(232,162,59,.14);
  --rose:#E4506A; --rose-soft:rgba(228,80,106,.10);
  --lime:#9BE33B;
  --side:#10142B; --side-ink:#EDEFFB; --side-mut:#8C94B8;
  --shadow:0 1px 2px rgba(18,23,46,.05),0 10px 30px rgba(18,23,46,.07);
  --glow:0 0 0 3px var(--acc-soft);
}
:root[data-theme=dark]{
  --bg:#0A0E1E; --panel:#121730; --panel2:#171D3B; --ink:#EDEFFB; --mut:#8C94B8;
  --line:#232B52; --line2:#2E3868;
  --acc:#8B7BFF; --acc-hi:#A093FF; --acc-ink:#0A0E1E; --acc-soft:rgba(139,123,255,.16);
  --mint:#2EE6A8; --mint-soft:rgba(46,230,168,.14);
  --amber:#F5B857; --amber-soft:rgba(245,184,87,.14);
  --rose:#FF7590; --rose-soft:rgba(255,117,144,.12);
  --lime:#C6F35F;
  --side:#0D1226; --side-ink:#EDEFFB; --side-mut:#8C94B8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.35);
  --glow:0 0 0 3px var(--acc-soft);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light dark}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.02em;font-weight:700}
.mono{font-family:"IBM Plex Mono",monospace}
input,select,textarea{font-family:Inter;font-size:14.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:11px;padding:11px 13px;width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:var(--glow)}
textarea{resize:vertical;min-height:84px}
label{display:block;font-size:13px;font-weight:600;margin:13px 0 6px}
.btn{font-family:Inter;font-weight:600;font-size:14px;border-radius:11px;padding:10px 17px;cursor:pointer;border:1px solid transparent;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center;background:transparent;color:var(--ink)}
.btn-primary{background:var(--acc);color:var(--acc-ink)}
.btn-primary:hover{background:var(--acc-hi);transform:translateY(-1px)}
.btn-ghost{border-color:var(--line2)}
.btn-ghost:hover{border-color:var(--acc);color:var(--acc)}
.btn-mint{background:var(--mint-soft);color:var(--mint)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;letter-spacing:-.03em}
.brand .dot{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#9F5CF7);position:relative;flex:none}
.brand .dot::after{content:"";position:absolute;inset:7px 7px auto auto;width:6px;height:6px;border-radius:50%;background:var(--lime)}
.chip{font-family:"IBM Plex Mono";font-size:11px;padding:3px 10px;border-radius:999px;font-weight:500;white-space:nowrap}
.chip.ok{background:var(--mint-soft);color:var(--mint)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.bad{background:var(--rose-soft);color:var(--rose)}
.chip.mut{background:var(--acc-soft);color:var(--acc)}
.chip.gray{background:color-mix(in srgb,var(--mut) 14%,transparent);color:var(--mut)}

/* login */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-left{background:var(--side);color:var(--side-ink);padding:52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-left::before{content:"";position:absolute;top:-30%;right:-25%;width:80%;height:120%;background:radial-gradient(circle,rgba(139,123,255,.22),transparent 62%)}
.login-left::after{content:"";position:absolute;bottom:-25%;left:-15%;width:60%;height:90%;background:radial-gradient(circle,rgba(198,243,95,.10),transparent 60%)}
.login-left h1{font-size:clamp(28px,3.4vw,44px);line-height:1.05;max-width:15ch;position:relative;font-weight:800}
.login-left h1 em{font-style:normal;background:linear-gradient(90deg,var(--acc-hi),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
.login-left .sub{color:var(--side-mut);margin-top:16px;max-width:36ch;position:relative;font-size:15.5px}
.login-left .foot{font-family:"IBM Plex Mono";font-size:12px;color:var(--side-mut);position:relative}
.login-right{display:flex;align-items:center;justify-content:center;padding:36px 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:30px;width:100%;max-width:430px}
.card h2{font-size:22px;margin-bottom:4px}
.card .hint{font-size:13.5px;color:var(--mut);margin-bottom:6px}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:8px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 0;font-size:13.5px;font-weight:600;color:var(--mut);cursor:pointer;font-family:Inter;transition:.15s}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--mut);font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.1em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.err{background:var(--rose-soft);color:var(--rose);border:1px solid color-mix(in srgb,var(--rose) 30%,transparent);border-radius:11px;padding:10px 13px;font-size:13.5px;margin-top:14px;display:none}
.err.show{display:block}
#gbtn{display:flex;justify-content:center;min-height:44px}
@media(max-width:860px){.login-wrap{grid-template-columns:1fr}.login-left{display:none}}

/* shell */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{color:var(--side-ink);padding:0 8px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav .grp{font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-mut);margin:12px 8px 5px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;font-size:14px;color:var(--side-mut);font-weight:500;transition:.13s}
.nav a:hover{color:var(--side-ink);background:rgba(255,255,255,.06)}
.nav a.on{color:var(--side-ink);background:rgba(139,123,255,.18)}
.nav a .ic{font-family:"IBM Plex Mono";font-size:11px;width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.09);display:grid;place-items:center;flex:none}
.side .spacer{flex:1}
.userbox{border-top:1px solid rgba(255,255,255,.1);padding-top:14px;font-size:13px}
.userbox .em{color:var(--side-mut);font-family:"IBM Plex Mono";font-size:11px;word-break:break-all}
.theme-toggle{display:flex;gap:6px;background:rgba(255,255,255,.07);border-radius:999px;padding:4px;margin:12px 0}
.theme-toggle button{flex:1;border:0;border-radius:999px;padding:6px;background:transparent;color:var(--side-mut);cursor:pointer;font-size:13px;font-family:Inter;font-weight:600}
.theme-toggle button.on{background:var(--acc);color:var(--acc-ink)}
.main{padding:28px 34px;max-width:1220px;width:100%}
.page-h{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h h1{font-size:25px}
.page-h .crumb{font-family:"IBM Plex Mono";font-size:12px;color:var(--mut)}
@media(max-width:760px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}}

/* widgets */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;transition:.15s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat .k{font-family:"IBM Plex Mono";font-size:11.5px;color:var(--mut)}
.stat .v{font-family:"Bricolage Grotesque";font-weight:700;font-size:29px;margin-top:5px}
.stat .v small{font-family:"IBM Plex Mono";font-size:12.5px;color:var(--mint);font-weight:500;margin-left:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:18px}
.panel-t{font-family:"Bricolage Grotesque";font-weight:700;font-size:15px;margin-bottom:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:"IBM Plex Mono";font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:500;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.bar{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:10px;margin:8px 0}
.bar .lbl{font-family:"IBM Plex Mono";font-size:12px;color:var(--mut)}
.bar .track{height:9px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--acc),#A78BFA);border-radius:6px;transition:width .8s ease}
.bar .fill.mint{background:linear-gradient(90deg,var(--mint),#7CF2C8)}
.bar .n{font-family:"IBM Plex Mono";font-size:12.5px;text-align:right;font-weight:500}
.grid2{display:grid;grid-template-columns:1.05fr 1fr;gap:18px}
@media(max-width:940px){.grid2{grid-template-columns:1fr}.stat-row{grid-template-columns:repeat(2,1fr)}}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input[type=search]{max-width:300px}
.empty{color:var(--mut);font-size:14px;padding:24px 0;text-align:center}
.empty b{display:block;font-family:"Bricolage Grotesque";color:var(--ink);font-size:16px;margin-bottom:4px}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:26px;text-align:center;color:var(--mut);font-size:14px;transition:.15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--acc-soft)}
.drop b{display:block;font-family:"Bricolage Grotesque";color:var(--ink);font-size:16px;margin-bottom:4px}
.note{font-size:12.5px;color:var(--mut);margin-top:8px}
.note code{font-family:"IBM Plex Mono";background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--bg);border-radius:13px;padding:12px 18px;font-size:14px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.22s;pointer-events:none;max-width:360px;z-index:99}
:root[data-theme=dark] .toast{background:var(--panel2);color:var(--ink);border:1px solid var(--line2)}
.toast.show{opacity:1;transform:none}
.reasons{margin:6px 0 0;font-size:12.5px;color:var(--rose)}
.reasons li{margin-left:16px}
.drive-card{border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;background:var(--panel2);transition:.15s}
.drive-card:hover{border-color:var(--line2)}
.drive-card .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.drive-card .nm{font-family:"Bricolage Grotesque";font-weight:700;font-size:16px}
.drive-card .pkg{font-family:"IBM Plex Mono";font-weight:600;color:var(--mint)}
.rule-row{display:grid;grid-template-columns:1.2fr .8fr 1.2fr 34px;gap:8px;margin-bottom:8px;align-items:center}
.rule-row .x{border:1px solid var(--line2);background:transparent;color:var(--rose);border-radius:9px;height:38px;cursor:pointer;font-size:16px}
.or-block{border:1px dashed var(--line2);border-radius:12px;padding:12px;margin:10px 0;background:var(--acc-soft)}
.or-block .t{font-family:"IBM Plex Mono";font-size:11px;color:var(--acc);letter-spacing:.08em;margin-bottom:8px}
.qa-item{border-bottom:1px solid var(--line);padding:13px 0}
.qa-item:last-child{border-bottom:0}
.qa-item .t{font-weight:600;font-size:14.5px}
.qa-item .b{color:var(--mut);font-size:13.5px;margin-top:3px}
.qa-item .ans{margin-top:9px;background:var(--mint-soft);border-radius:11px;padding:10px 13px;font-size:13.5px}
.cal-day{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.cal-day:last-child{border-bottom:0}
.cal-day .d{font-family:"IBM Plex Mono";min-width:88px;font-size:12.5px;color:var(--mut);padding-top:2px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--mut)}
.kv .v{font-weight:600;text-align:right}
.switch{display:flex;align-items:center;gap:10px;padding:10px 0}
.switch input{width:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================ core ============================ */
const $=s=>document.querySelector(s);
const root=$("#root");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let AUTH=JSON.parse(localStorage.getItem("cohort_auth")||"null");
let CFG={google_client_id:null};
const THEME_KEY="cohort_theme";
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem(THEME_KEY,t);
  document.querySelectorAll(".theme-toggle button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));}
applyTheme(localStorage.getItem(THEME_KEY)||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3200);}
function saveAuth(a){AUTH=a;localStorage.setItem("cohort_auth",JSON.stringify(a));}
function signOut(){localStorage.removeItem("cohort_auth");AUTH=null;location.hash="#/login";render();}
async function api(path,opts={}){
  const headers=opts.headers||{};
  if(AUTH?.token)headers["Authorization"]="Bearer "+AUTH.token;
  if(opts.body&&!(opts.body instanceof FormData))headers["Content-Type"]="application/json";
  const r=await fetch(path,{...opts,headers});
  if(r.status===401&&AUTH){signOut();throw new Error("Session expired — sign in again");}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.detail||("Request failed ("+r.status+")"));
  return d;
}
const money=v=>v==null?"—":"₹"+(v/100000).toFixed(1)+"\u00A0LPA";
const RL={resume_screening:"Screening",online_assessment:"Online test",technical_1:"Tech 1",technical_2:"Tech 2",technical_3:"Tech 3",managerial:"Managerial",hr:"HR",final_placement:"Placed"};
const ROUNDS=Object.keys(RL);
const isStaff=()=>AUTH&&["owner","admin","sub_admin"].includes(AUTH.role);

/* ============================ login ============================ */
function LoginView(){
  root.innerHTML=`
  <div class="login-wrap">
    <div class="login-left">
      <a class="brand" href="/"><span class="dot"></span>Cohort</a>
      <div><h1>Your placement season, <em>finally organised.</em></h1>
        <p class="sub">Drives, eligibility, interviews, feedback — one workspace your whole college shares.</p></div>
      <p class="foot">roster-verified · scoped access · zero spreadsheets</p>
    </div>
    <div class="login-right"><div class="card">
      <div class="tabs"><button id="tab-in" class="on">Sign in</button><button id="tab-claim">Claim account</button></div>
      <div id="pane-in">
        <h2>Welcome back</h2>
        <p class="hint">College Google account, or email &amp; password.</p>
        <div id="gbtn"></div><div class="divider" id="gdiv">OR</div>
        <label for="li-email">Email</label><input id="li-email" type="email" autocomplete="email" placeholder="you@college.ac.in">
        <label for="li-pass">Password</label><input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••">
        <div class="err" id="li-err"></div>
        <button class="btn btn-primary" id="li-go" style="width:100%;margin-top:16px">Sign in</button>
      </div>
      <div id="pane-claim" style="display:none">
        <h2>Claim your account</h2>
        <p class="hint">First time here? Use the activation code from your placement cell.</p>
        <label>College code</label><input id="cl-college" placeholder="e.g. gnc" autocapitalize="none">
        <label>Roll number</label><input id="cl-roll" placeholder="e.g. 01GNC22CS001" autocapitalize="characters">
        <label>Activation code</label><input id="cl-code" placeholder="8-character code" autocapitalize="characters">
        <label>Choose a password <span style="color:var(--mut);font-weight:400">(min 8 chars)</span></label>
        <input id="cl-pass" type="password" autocomplete="new-password">
        <div class="err" id="cl-err"></div>
        <button class="btn btn-primary" id="cl-go" style="width:100%;margin-top:16px">Claim account &amp; sign in</button>
      </div>
    </div></div>
  </div>`;
  const swap=cl=>{$("#pane-in").style.display=cl?"none":"";$("#pane-claim").style.display=cl?"":"none";
    $("#tab-in").classList.toggle("on",!cl);$("#tab-claim").classList.toggle("on",cl);};
  $("#tab-in").onclick=()=>swap(false);$("#tab-claim").onclick=()=>swap(true);
  if(CFG.google_client_id){
    const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;
    s.onload=()=>{google.accounts.id.initialize({client_id:CFG.google_client_id,callback:async resp=>{
      try{saveAuth(await api("/api/auth/google",{method:"POST",body:JSON.stringify({credential:resp.credential})}));enterApp();}
      catch(e){sErr("#li-err",e.message);}}});
      google.accounts.id.renderButton($("#gbtn"),{theme:"outline",size:"large",width:366,text:"continue_with"});};
    document.head.appendChild(s);
  }else{$("#gbtn").style.display="none";$("#gdiv").style.display="none";}
  const sErr=(sel,m)=>{const e=$(sel);e.textContent=m;e.classList.add("show");};
  $("#li-go").onclick=async()=>{$("#li-err").classList.remove("show");$("#li-go").disabled=true;
    try{saveAuth(await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("#li-email").value.trim(),password:$("#li-pass").value})}));enterApp();}
    catch(e){sErr("#li-err",e.message);}finally{$("#li-go").disabled=false;}};
  $("#li-pass").addEventListener("keydown",e=>{if(e.key==="Enter")$("#li-go").click();});
  $("#cl-go").onclick=async()=>{$("#cl-err").classList.remove("show");$("#cl-go").disabled=true;
    try{saveAuth(await api("/api/auth/claim",{method:"POST",body:JSON.stringify({college_slug:$("#cl-college").value.trim(),roll_no:$("#cl-roll").value.trim(),activation_code:$("#cl-code").value.trim(),password:$("#cl-pass").value})}));toast("Account created — welcome!");enterApp();}
    catch(e){sErr("#cl-err",e.message);}finally{$("#cl-go").disabled=false;}};
}

/* ============================ shell ============================ */
const STAFF_NAV=[["Manage",[["#/dashboard","D","Dashboard"],["#/students","R","Students"],["#/import","↥","Import roster"],["#/drives-admin","C","Drives"]]],
                 ["Configure",[["#/policy","P","Placement policy"],["#/notes","N","Notes & calendar"]]],
                 ["Insights",[["#/analytics","A","Analytics"],["#/qa-admin","Q","Q&A inbox"],["#/edits","E","Edit requests"]]]];
const STUDENT_NAV=[["Placements",[["#/home","H","My placements"],["#/drives","C","Drives"],["#/feedback","F","Experiences"]]],
                   ["You",[["#/profile","U","Profile"],["#/qa","Q","Q&A"]]]];
function Shell(html,active){
  const groups=(isStaff()?STAFF_NAV:STUDENT_NAV).map(([g,items])=>
    `<div class="grp">${g}</div>`+items.map(([h,ic,l])=>`<a href="${h}" class="${h===active?'on':''}"><span class="ic">${ic}</span>${l}</a>`).join("")).join("");
  root.innerHTML=`
  <div class="shell">
    <aside class="side">
      <a class="brand" href="/"><span class="dot"></span>Cohort</a>
      <nav class="nav">${groups}</nav>
      <div class="spacer"></div>
      <div class="userbox">
        <div style="font-weight:600">${esc(AUTH.user?.full_name||"—")}</div>
        <div class="em">${esc(AUTH.user?.email||"")}</div>
        <div style="margin:7px 0"><span class="chip mut">${esc(AUTH.role)}</span></div>
        <div class="theme-toggle">

    </div>`,"#/drives-admin");

    const t=await api(`/api/admin/companies/${cid}/rules`);
    if(t&&t.all){for(const n of t.all){
      if(n.field)RB.rows.push({field:n.field,op:n.op,value:Array.isArray(n.value)?n.value.join(","):String(n.value)});
      else if(n.any)for(const l of n.any)if(l.field)RB.orRows.push({field:l.field,op:l.op,value:Array.isArray(l.value)?l.value.join(","):String(l.value)});}}
  }catch{}
  for(const r of [...RB.rows,...RB.orRows])   // unknown fields render as themselves

function rbOpts(sel){return RB.attrs.map(a=>`<option value="${a.key}" ${a.key===sel?'selected':''}>${esc(a.label)}</option>`).join("");}
function rbRowHTML(list,i,r){return `<div class="rule-row">
  <select onchange="RB.${list}[${i}].field=this.value;rbEng()">${rbOpts(r.field)}</select>
  <select onchange="RB.${list}[${i}].op=this.value;rbEng()">${[">=","<=","==","!=","in","not_in"].map(o=>`<option ${o===r.op?'selected':''}>${o}</option>`).join("")}</select>
  <input value="${esc(r.value)}" placeholder="value (comma-sep for in)" oninput="RB.${list}[${i}].value=this.value;rbEng()">
  <button class="x" onclick="RB.${list}.splice(${i},1);rbRender()">✕</button></div>`;}
function rbRender(){
  $("#rb-rows").innerHTML=RB.rows.map((r,i)=>rbRowHTML("rows",i,r)).join("")||`<p class="note">No conditions yet — everyone qualifies.</p>`;
  $("#rb-or").innerHTML=RB.orRows.map((r,i)=>rbRowHTML("orRows",i,r)).join("")||`<p class="note" style="margin:0">None.</p>`;
  rbEng();
}
function rbAdd(or){(or?RB.orRows:RB.rows).push({field:RB.attrs[0].key,op:">=",value:""});rbRender();}
function rbEng(){
  const say=r=>{const a=RB.attrs.find(x=>x.key===r.field);return `${a?a.label:r.field} ${r.op} ${r.value||"…"}`;};
  let t=RB.rows.map(say).join(", AND ")||"anyone";
  if(RB.orRows.length)t+=`, AND at least one of: ${RB.orRows.map(say).join(" / ")}`;
  $("#rb-eng").textContent=t;
}
function rbTree(){
  const leaf=r=>{const a=RB.attrs.find(x=>x.key===r.field);const num=a&&a.data_type==="number";
    let v=r.value;if(["in","not_in"].includes(r.op))v=v.split(",").map(s=>s.trim()).filter(Boolean);
    else if(num)v=parseFloat(v);else if(a&&a.data_type==="boolean")v=v==="true";
    return {field:r.field,op:r.op,value:v,label:a?a.label:r.field};};
  const all=RB.rows.map(leaf);
  if(RB.orRows.length)all.push({any:RB.orRows.map(leaf)});
  return all.length?{all}:null;
}
async function rbSave(cid){try{await api(`/api/admin/companies/${cid}/rules`,{method:"PUT",body:JSON.stringify({rules:rbTree()})});toast("Rules saved");}catch(e){toast(e.message);}}
async function rbPreview(cid){try{await rbSave(cid);const p=await api(`/api/admin/companies/${cid}/eligibility-preview`);
  const el=$("#rb-prev");el.style.display="inline-block";el.textContent=`${p.eligible} of ${p.total} students eligible`;}catch(e){toast(e.message);}}
async function addAttr(cid,name){try{const k=$("#at-k").value;await api("/api/admin/attributes",{method:"POST",body:JSON.stringify({key:k,label:k.replace(/_/g," "),data_type:$("#at-t").value})});
  toast("Attribute added");RuleBuilder(cid,name);}catch(e){toast(e.message);}}

async function PolicyView(){
  Shell(`<div class="page-h"><h1>Placement policy</h1></div>
    <div class="grid2">
      <div class="panel"><div class="panel-t">College-wide rules</div>
        <div class="switch"><input type="checkbox" id="p-one"><label style="margin:0">One offer per student (strict)</label></div>
        <label>Maximum offers per student (blank = no cap)</label><input id="p-max" type="number" min="1">
        <label>Upgrade rule after an offer</label>
        <select id="p-up"><option value="none">None — anyone can keep sitting</option>
          <option value="multiplier">Multiplier — must pay ≥ N× current best</option>
          <option value="higher_slab">Salary slabs — higher slab only</option>
          <option value="both">Both (strictest)</option></select>
        <label>Multiplier (e.g. 1.5)</label><input id="p-mult" type="number" step="0.1" value="1.5">
        <label>Slabs (LPA caps, comma-sep; last is open) e.g. 5,10</label><input id="p-slabs" placeholder="5,10">
        <button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="savePolicy()">Save policy</button>
      </div>
      <div class="panel"><div class="panel-t">How it plays out</div>
        <p class="note" style="font-size:13.5px;margin:0">A student placed at ₹6 LPA:<br><br>
        · <b>Multiplier 1.5×</b> → can only register for drives paying ≥ ₹9 LPA.<br>
        · <b>Slabs 5,10</b> → they're in slab 2 (5–10), so only slab 3 (&gt;10 LPA) drives.<br>
        · <b>One offer</b> → they're done for the season.<br><br>
        Blocked students see the exact rule in their Drives page — no more "why can't I register" queues at your desk.</p></div>
    </div>`,"#/policy");
  try{const p=await api("/api/admin/policy");
    $("#p-one").checked=!!p.one_offer;$("#p-max").value=p.max_offers||"";
    $("#p-up").value=p.upgrade||"none";$("#p-mult").value=p.multiplier||1.5;
    $("#p-slabs").value=(p.slabs||[]).filter(s=>s.max_lpa).map(s=>s.max_lpa).join(",");}catch(e){toast(e.message);}
}
async function savePolicy(){
  const caps=$("#p-slabs").value.split(",").map(s=>parseFloat(s.trim())).filter(n=>!isNaN(n));
  const slabs=caps.map((c,i)=>({name:"S"+(i+1),max_lpa:c}));if(caps.length)slabs.push({name:"S"+(caps.length+1)});
  try{await api("/api/admin/policy",{method:"PUT",body:JSON.stringify({one_offer:$("#p-one").checked,
    max_offers:+$("#p-max").value||null,upgrade:$("#p-up").value,multiplier:+$("#p-mult").value||null,slabs})});
    toast("Policy saved — applies to every drive instantly");}catch(e){toast(e.message);}}

async function AnalyticsView(){
  Shell(`<div class="page-h"><h1>Analytics</h1><button class="btn btn-ghost btn-sm" id="ex">Export report CSV</button></div>
    <div class="stat-row" id="st"></div>
    <div class="stat-row" id="st2" style="grid-template-columns:repeat(3,1fr)"></div>
    <div class="grid2">
      <div>
        <div class="panel"><div class="panel-t">Branch performance</div>
          <table><thead><tr><th>Branch</th><th>Placed</th><th>Rate</th><th>Avg pkg</th></tr></thead><tbody id="bw"></tbody></table></div>
        <div class="panel"><div class="panel-t">Drive conversion</div>
          <table><thead><tr><th>Company</th><th>Reg</th><th>Active</th><th>Placed</th><th>Conv</th></tr></thead><tbody id="dc"></tbody></table></div>
      </div>
      <div>
        <div class="panel"><div class="panel-t">CTC distribution (offers)</div><div id="ctc"></div>
          <div class="panel-t" style="margin-top:18px">Offers by month</div><div id="tl"></div></div>
        <div class="panel"><div class="panel-t">Live round funnel</div><div id="rf"></div>
          <div class="panel-t" style="margin-top:18px">Top offers</div><div id="top"></div></div>
      </div>
    </div>`,"#/analytics");
  try{const a=await api("/api/admin/analytics");const o=a.overview;
    $("#st").innerHTML=[["Placement rate",o.placement_rate+"%"],["Placed / students",o.placed+" / "+o.students],
      ["Avg package",money(a.package.avg)],["Highest",money(a.package.max)]]
      .map(([k,v])=>`<div class="stat"><div class="k">${k}</div><div class="v" style="font-size:22px">${v}</div></div>`).join("");
    const ai=a.action_items, cg=a.cgpa_insight;
    $("#st2").innerHTML=[
      [`Never applied`,ai.never_applied,ai.never_applied>0?"var(--rose)":"var(--mint)"],
      [`No resume yet`,ai.no_resume,ai.no_resume>0?"var(--amber)":"var(--mint)"],
      [`CGPA placed vs rest`,cg.placed_avg+" vs "+cg.unplaced_avg,"var(--acc)"]]
      .map(([k,v,c])=>`<div class="stat"><div class="k">${k}</div><div class="v" style="font-size:22px;color:${c}">${v}</div></div>`).join("");
    $("#bw").innerHTML=a.branch_wise.map(b=>{const r=b.students?Math.round(100*b.placed/b.students):0;
      return `<tr><td><span class="chip gray">${esc(b.branch)}</span></td><td class="mono">${b.placed}/${b.students}</td>
      <td><div class="track" style="height:8px;width:70px;display:inline-block;background:var(--line);border-radius:5px;overflow:hidden;vertical-align:middle"><div class="fill mint" style="width:${r}%;height:100%"></div></div> <span class="mono" style="font-size:12px">${r}%</span></td>
      <td class="mono">${b.avg_package?money(b.avg_package):"—"}</td></tr>`;}).join("");
    $("#dc").innerHTML=a.drive_conversion.map(d=>{const cv=d.registered?Math.round(100*d.placed/d.registered):0;
      return `<tr><td>${esc(d.name)} <span class="chip ${d.status===1?'ok':'gray'}" style="font-size:10px">${d.status===1?'open':d.status===2?'closed':'draft'}</span></td>
      <td class="mono">${d.registered}</td><td class="mono">${d.in_process}</td><td class="mono">${d.placed}</td>
      <td class="mono" style="color:${cv>0?'var(--mint)':'var(--mut)'}">${cv}%</td></tr>`;}).join("");
    const BUCK=["< 5 LPA","5–10 LPA","10–15 LPA","15+ LPA"];
    const dist=[0,1,2,3].map(i=>({label:BUCK[i],n:(a.ctc_distribution.find(x=>x.bucket===i)||{}).offers||0}));
    const dmx=Math.max(...dist.map(d=>d.n),1);
    $("#ctc").innerHTML=dist.map(d=>`<div class="bar"><span class="lbl">${d.label}</span>
      <div class="track"><div class="fill" style="width:${(d.n/dmx*100).toFixed(0)}%"></div></div><span class="n">${d.n}</span></div>`).join("");
    const tmx=Math.max(...a.timeline.map(t=>t.offers),1);
    $("#tl").innerHTML=a.timeline.map(t=>`<div class="bar"><span class="lbl">${esc(t.month)}</span>
      <div class="track"><div class="fill mint" style="width:${(t.offers/tmx*100).toFixed(0)}%"></div></div><span class="n">${t.offers}</span></div>`).join("")||`<p class="note">No offers yet.</p>`;
    const rmx=Math.max(...a.round_funnel.map(r=>r.count),1);
    $("#rf").innerHTML=ROUNDS.filter(x=>a.round_funnel.find(r=>r.round===x)).map(x=>{const n=a.round_funnel.find(r=>r.round===x).count;
      return `<div class="bar"><span class="lbl">${RL[x]}</span><div class="track"><div class="fill" style="width:${(n/rmx*100).toFixed(0)}%"></div></div><span class="n">${n}</span></div>`;}).join("")||`<p class="note">No active applications.</p>`;
    $("#top").innerHTML=a.top_offers.slice(0,5).map(t=>`<div class="kv"><span class="k">${esc(t.full_name)} · ${esc(t.company)}</span><span class="v mono">${money(t.package)}</span></div>`).join("")||`<p class="note">—</p>`;
    $("#ex").onclick=()=>{let csv="section,key,value\n";
      csv+=Object.entries(o).map(([k,v])=>`overview,${k},${v}`).join("\n")+"\n";
      csv+=a.branch_wise.map(b=>`branch,${b.branch},${b.placed}/${b.students} avg=${b.avg_package}`).join("\n")+"\n";
      csv+=a.drive_conversion.map(d=>`drive,${d.name.replace(/,/g,";")},reg=${d.registered} placed=${d.placed}`).join("\n");
      const el=document.createElement("a");el.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));el.download="placement-report.csv";el.click();};
  }catch(e){toast(e.message);}
}

async function QAAdmin(){
  Shell(`<div class="page-h"><h1>Q&amp;A inbox</h1><span class="crumb">CRs escalate · PO answers</span></div>
    <div class="panel" id="qs"></div>`,"#/qa-admin");
  try{const qs=await api("/api/admin/questions");
    $("#qs").innerHTML=qs.map(q=>`<div class="qa-item">
      <div class="t">${esc(q.title)} <span class="chip gray" style="margin-left:6px">${esc(q.branch||"")} · ${esc(q.roll_no||"")}</span>
        <span class="chip ${q.status==='answered'?'ok':q.status==='escalated'?'warn':'gray'}" style="margin-left:6px">${q.status}</span></div>
      ${q.body?`<div class="b">${esc(q.body)}</div>`:""}
      ${q.answer?`<div class="ans">${esc(q.answer)}</div>`:`
        <div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap">
          ${q.status==='open'?`<button class="btn btn-ghost btn-sm" onclick="modQ(${q.id},'escalate')">Escalate to PO</button>`:""}
          ${AUTH.role!=='sub_admin'?`<input id="ans-${q.id}" placeholder="Answer…" style="max-width:340px">
          <button class="btn btn-primary btn-sm" onclick="modQ(${q.id},'answer')">Answer &amp; publish</button>`:""}</div>`}
    </div>`).join("")||`<div class="empty"><b>Inbox zero</b></div>`;}catch(e){toast(e.message);}
}
async function modQ(id,action){const body={action};if(action==="answer")body.answer=$("#ans-"+id).value;
  try{await api("/api/admin/questions/"+id,{method:"PATCH",body:JSON.stringify(body)});toast(action==="answer"?"Published to all students":"Escalated");QAAdmin();}catch(e){toast(e.message);}}

/* ============================ router ============================ */
const ROUTES={"#/login":LoginView,"#/dashboard":Dashboard,"#/students":StudentsView,"#/import":ImportView,
  "#/drives-admin":DrivesAdmin,"#/policy":PolicyView,"#/notes":NotesView,"#/analytics":AnalyticsView,
  "#/qa-admin":QAAdmin,"#/edits":EditsAdmin,
  "#/home":StudentHome,"#/drives":DrivesStudent,"#/profile":ProfileView,"#/qa":QAStudent,"#/feedback":FeedbackView};
const STAFF_ONLY=["#/dashboard","#/students","#/import","#/drives-admin","#/policy","#/notes","#/analytics","#/qa-admin","#/edits"];
function enterApp(){location.hash=isStaff()?"#/dashboard":"#/home";render();}
function render(){
  let h=location.hash||"";
  if(!AUTH)h="#/login";
  else if(!ROUTES[h]||h==="#/login")h=isStaff()?"#/dashboard":"#/home";
  else if(!isStaff()&&STAFF_ONLY.includes(h))h="#/home";
  if(location.hash!==h){location.hash=h;return;}
  ROUTES[h]();
}
window.addEventListener("hashchange",render);
(async()=>{try{CFG=await api("/api/auth/config");}catch{}render();})();
</script>
