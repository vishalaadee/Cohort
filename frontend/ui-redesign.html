<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placement Desk</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap");

/* ===========================================================
   Dark-first. Neutrals are shared; the accent changes by role:
   Admin crimson · CR green · Student gold · Junior deep blue.
   =========================================================== */
:root{
  --paper:#07090A; --panel:#0F1214; --sunken:#0B0E0F; --raised:#141819;
  --ink:#E7EAEA; --ink-2:#99A2A4; --ink-3:#6A7375;
  --line:#1C2123; --line-2:#2A3134;
  --ok:#3ECF8E; --ok-soft:#0F241A;
  --warn:#D8A94A; --warn-soft:#241D0E;
  --bad:#E0726C; --bad-soft:#261513;
  --pro:#C8A451; --pro-soft:#221C0D;
  --acc:#D9463F; --acc-hi:#E96159; --acc-ink:#FFFFFF; --acc-soft:#28110F;
  --r:9px; --r-lg:13px;
}
:root[data-role="cr"]     {--acc:#33B36B;--acc-hi:#4FC77F;--acc-ink:#04140B;--acc-soft:#0D2317}
:root[data-role="student"]{--acc:#D4A937;--acc-hi:#E3BC55;--acc-ink:#15110A;--acc-soft:#241C09}
:root[data-role="junior"] {--acc:#4483DD;--acc-hi:#5E98EA;--acc-ink:#FFFFFF;--acc-soft:#0E1B2C}

:root[data-theme="light"]{
  --paper:#F6F6F5; --panel:#FFFFFF; --sunken:#EFEFEE; --raised:#FAFAF9;
  --ink:#15191A; --ink-2:#515a5c; --ink-3:#7C8486;
  --line:#E4E4E2; --line-2:#D3D4D1;
  --ok:#14794F; --ok-soft:#E4F1EA; --warn:#8E6314; --warn-soft:#F7EFDD;
  --bad:#A83A33; --bad-soft:#F8E8E6; --pro:#8A6A17; --pro-soft:#F6EFDC;
  --acc:#B3261E; --acc-hi:#95190F; --acc-ink:#FFFFFF; --acc-soft:#FAE8E6;
}
:root[data-theme="light"][data-role="cr"]     {--acc:#1E7A46;--acc-hi:#156337;--acc-ink:#FFFFFF;--acc-soft:#E5F2EA}
:root[data-theme="light"][data-role="student"]{--acc:#8A6A12;--acc-hi:#70560D;--acc-ink:#FFFFFF;--acc-soft:#F8F0D9}
:root[data-theme="light"][data-role="junior"] {--acc:#1F4FA0;--acc-hi:#173F85;--acc-ink:#FFFFFF;--acc-soft:#E7EEF9}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
h2{font-size:15.5px;font-weight:600;margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.demobar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-3);position:sticky;top:0;z-index:40}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:4px 11px;cursor:pointer;font-size:12.5px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);font-weight:600}
.demobar .sp{flex:1 1 auto}

.shell{display:flex;min-height:calc(100vh - 37px)}
.rail{width:192px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:16px 11px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 16px;font-weight:600;font-size:14.5px}
.brand .mk{width:18px;height:18px;border-radius:5px;background:var(--acc);flex:none;position:relative}
.brand .mk::after{content:"";position:absolute;right:3px;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--pro)}
.rail a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:var(--ink-2);font-size:14px}
.rail a:hover{background:var(--sunken);color:var(--ink)}
.rail a[aria-current="page"]{background:var(--acc-soft);color:var(--acc);font-weight:600}
.rail a .ct{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.rail a[aria-current="page"] .ct{color:var(--acc)}
.rfoot{margin-top:auto;border-top:1px solid var(--line);padding:12px 9px 0;font-size:12.5px;color:var(--ink-3)}
.rfoot b{display:block;color:var(--ink-2);font-weight:600}

main{flex:1 1 auto;min-width:0;padding-block:24px;padding-left:24px;padding-right:24px}
.wrap{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.head .sub{color:var(--ink-3);font-size:14px;margin-top:2px}
.head .rt{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.back{font-size:13.5px;color:var(--ink-3)}
.back:hover{color:var(--acc)}

.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn-p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn-p:hover{background:var(--acc-hi);border-color:var(--acc-hi);color:var(--acc-ink)}
.btn-s{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line-2);color:inherit}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.list{display:flex;flex-direction:column}
.ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ch .rt{margin-left:auto;display:flex;gap:8px;align-items:center}
.cb{padding:16px}
.quiet{font-size:13.5px;color:var(--ink-3);line-height:1.6;padding:0 2px}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:5px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.acc{background:var(--acc-soft);color:var(--acc)}
.tag.pro{background:var(--pro-soft);color:var(--pro)}

.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 3px}
.tabs button{border:0;background:transparent;padding:9px 12px;font-size:14px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.tabs .ct{font-size:12px;color:var(--ink-3);margin-left:5px}

.filters{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.filters button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.filters button:hover{background:var(--sunken)}
.filters button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);font-weight:600}
.filters .ct{font-size:12px;opacity:.75;margin-left:4px}
.sel{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 9px;font:inherit;font-size:13.5px}
.search{width:100%;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:9px 12px;font:inherit;font-size:14px;color:var(--ink)}
.search::placeholder{color:var(--ink-3)}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.task{display:flex;gap:15px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .bd{flex:1 1 auto;min-width:0}
.task .t{font-size:15px;font-weight:500;line-height:1.4}
.task .d{font-size:13.5px;color:var(--ink-3);margin-top:2px}
.task .rt{flex:none;display:flex;gap:8px;align-items:center}

.mx{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.mx .m{flex:1 1 145px;padding:13px 15px;border-right:1px solid var(--line);min-width:0}
.mx .m:last-child{border-right:0}
.mx .k{font-size:12px;color:var(--ink-3)}
.mx .v{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:1px}
.mx .d{font-size:12.5px;color:var(--ink-3)}

.drive{display:flex;gap:13px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.drive:first-child{border-top:0}
.drive:hover{background:var(--raised)}
.drive .cbx{flex:none;align-self:flex-start;margin-top:3px}
.drive .bd{flex:1 1 auto;min-width:0}
.drive .nm{font-size:15px;font-weight:600}
.drive .fx{font-size:13px;color:var(--ink-3);margin-top:1px}
.drive .st{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.drive .st b{font-weight:600;color:var(--ink)}
.drive .rt{flex:none;display:flex;gap:8px;align-items:center}

.strip{display:flex;align-items:center;gap:3px;margin-top:6px}
.sg{min-width:29px;height:20px;padding:0 5px;border-radius:4px;background:var(--sunken);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-2)}
.sg.on{background:var(--acc-soft);color:var(--acc)}
.sg.stall{background:var(--warn-soft);color:var(--warn)}
.sg.z{opacity:.45}
.legend{display:flex;align-items:center;gap:3px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--raised)}
.legend span{min-width:29px;padding:0 5px;text-align:center;font-size:10.5px;color:var(--ink-3)}
.legend .lb{min-width:0;padding:0;margin-right:8px;font-size:12px;color:var(--ink-3)}

.bulk{display:flex;align-items:center;gap:9px;padding:8px 16px;background:var(--acc-soft);border-bottom:1px solid var(--line);font-size:13.5px;color:var(--acc)}
.bulk .rt{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.bulk .btn{background:var(--panel);border-color:transparent}

.focus{background:var(--acc-soft);border:1px solid color-mix(in oklab,var(--acc) 26%,transparent);border-radius:var(--r-lg);padding:15px 16px;display:flex;gap:15px;align-items:center}
.focus .bd{flex:1 1 auto}
.focus .t{font-size:15px;font-weight:600}
.focus .d{font-size:13.5px;color:var(--ink-2);margin-top:2px}

.stage{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.stage:first-child{border-top:0}
.stage:hover,.stage[aria-expanded="true"]{background:var(--sunken)}
.stage .nm{flex:1 1 auto;font-size:14.5px}
.stage .ct{font-size:14px;color:var(--ink-2)}
.stage .ar{color:var(--ink-3);font-size:12px}
.people{padding:2px 16px 15px;border-top:1px solid var(--line);background:var(--sunken)}
.person{display:flex;gap:11px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.person:last-of-type{border-bottom:0}
.person .nm{flex:1 1 auto;font-size:14px}
.person .rl{font-size:13px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--acc);cursor:pointer;margin:0;flex:none}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:500;padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 16px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--raised)}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.tf{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.tf .rt{margin-left:auto;display:flex;gap:6px}

.set{display:flex;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set .bd{flex:1 1 auto;min-width:0}
.set .t{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.set .d{font-size:13px;color:var(--ink-3);margin-top:2px}
.set .k{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.set .rt{flex:none;display:flex;align-items:center;gap:9px}
.set.off{background:var(--raised);opacity:.85}
.sw{position:relative;width:35px;height:20px;flex:none;display:block}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw i{position:absolute;inset:0;background:var(--line-2);border-radius:99px;transition:.15s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:.15s}
.sw input:checked + i{background:var(--acc)}
.sw input:checked + i::after{transform:translateX(15px)}
.code{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:13.5px;letter-spacing:.08em;background:var(--sunken);border:1px solid var(--line-2);border-radius:6px;padding:3px 10px;color:var(--ink)}

/* charts */
.bars{display:flex;flex-direction:column;gap:8px;padding:16px}
.bar{display:grid;grid-template-columns:128px 1fr auto;gap:11px;align-items:center}
.bar .l{font-size:13.5px}
.bar .t{height:7px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar .f{height:100%;background:var(--acc);border-radius:99px}
.bar .v{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);min-width:90px;text-align:right}
.bar .v span{color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.hm{display:grid;gap:3px;padding:16px;overflow-x:auto}
.hm .hcell{padding:7px 4px;text-align:center;font-size:12px;border-radius:4px;font-family:"IBM Plex Mono",monospace}
.hm .hlbl{font-size:12px;color:var(--ink-3);padding:7px 4px;text-align:right;white-space:nowrap}
.hm .hhead{font-size:11px;color:var(--ink-3);padding:0 4px 3px;text-align:center}
.spark{padding:16px}

/* pro / premium lock */
.lock{display:flex;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);background:var(--raised)}
.lock:first-child{border-top:0}
.lock .bd{flex:1 1 auto;min-width:0}
.lock .t{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.lock .t .ast{color:var(--pro);font-weight:700}
.lock .d{font-size:13px;color:var(--ink-3);margin-top:2px}
.lock .rt{flex:none}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border-radius:0 0 var(--r-lg) var(--r-lg);overflow:hidden}
.cal .dh{background:var(--raised);padding:7px 8px;font-size:11.5px;color:var(--ink-3);text-align:center}
.cal .dy{background:var(--panel);min-height:76px;padding:6px 7px;font-size:12px}
.cal .dy.dim{color:var(--ink-3);background:var(--sunken)}
.cal .dy .dn{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.cal .dy.today .dn{color:var(--acc);font-weight:600}
.ev{display:block;margin-top:3px;font-size:11px;padding:2px 5px;border-radius:4px;background:var(--acc-soft);color:var(--acc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.t2{background:var(--warn-soft);color:var(--warn)}
.ev.t3{background:var(--ok-soft);color:var(--ok)}

.why{margin-top:8px;border-left:2px solid var(--line-2);padding:1px 0 1px 12px}
.why .h{font-size:13px;color:var(--ink-3)}
.why ul{margin:3px 0 0;padding-left:15px;display:flex;flex-direction:column;gap:2px}
.why li{font-size:14px;color:var(--ink-2)}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 14px;padding:14px 16px}
.col{display:flex;gap:9px;align-items:center;font-size:13.5px;padding:3px 0}

@media (max-width:880px){
  .shell{flex-direction:column}
  .rail{width:auto;flex-direction:row;align-items:center;gap:3px;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:37px;z-index:30}
  .brand{padding:0 10px 0 2px}
  .rfoot{display:none}
  .rail a{white-space:nowrap;padding:6px 10px}
  main{padding-left:14px;padding-right:14px}
  .task,.drive,.focus,.lock{flex-direction:column;align-items:flex-start;gap:10px}
  .bar{grid-template-columns:92px 1fr auto}
  .legend{display:none}
  .cal .dy{min-height:56px}
}
</style>
</head>
<body>

<div class="demobar">
  <span>Mockup · view as</span>
  <div class="seg" id="roleseg" role="group" aria-label="Preview role">
    <button type="button" data-role="admin" aria-pressed="true">Admin</button>
    <button type="button" data-role="cr" aria-pressed="false">CR</button>
    <button type="button" data-role="student" aria-pressed="false">Student</button>
    <button type="button" data-role="junior" aria-pressed="false">Junior</button>
  </div>
  <span class="sp"></span>
  <div class="seg" role="group" aria-label="Theme">
    <button type="button" id="th-dark" aria-pressed="true">Dark</button>
    <button type="button" id="th-light" aria-pressed="false">Light</button>
  </div>
</div>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Main"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>

<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  ["Beacon Labs","Dream","36 L","—","Not published yet",null,null,"Not published"],
];
const STAGES=[["Applied",28],["Screened",22],["Awaiting test result",6],["In interviews",6],["Final round",2],["Offer",0]];
const WAITING=[["Sanjay Rao","01DIT23007"],["Meera Thomas","01DIT23026"],["Divya Suresh","01DIT23018"],["Imran Qureshi","01DIT23011"],["Rohit Varma","01DIT23022"],["Nikhil Pai","01DIT23013"]];
const EXPORT_COLS=[["roll_no","Roll number",1],["full_name","Name",1],["branch","Branch",1],["email","Email",1],["cgpa","CGPA",1],["backlogs","Backlogs",0],["phone","Phone",0],["tenth_pct","10th %",0],["twelfth_pct","12th %",0],["gender","Gender",0],["resume","Resume link",0],["applied_at","Applied on",0]];
const STUDENTS=[
  ["Aarav Kulkarni","01DIT23001","CSE",8.42,0,"Applied to 2"],
  ["Kavya Bhat","01DIT23002","ISE",7.90,0,"In interviews"],
  ["Rahul Menon","01DIT23003","ECE",6.75,1,"Not signed in"],
  ["Aarti Nair","01DIT23004","CSE",9.10,0,"In interviews"],
  ["Sneha Deshpande","01DIT23005","CSE",8.65,0,"Placed"],
  ["Vikram Shetty","01DIT23006","MECH",6.20,2,"Not signed in"],
  ["Sanjay Rao","01DIT23007","CSE",6.80,1,"Applied to 1"],
];

        <div class="rt"><button class="btn btn-s" type="button">Replace</button></div></div>
    </div></div>`
  :`
    <div class="card"><div class="list">
      <div class="set"><div class="bd"><div class="t">Your college</div><div class="d">Always sees your marks, applications and placement status</div></div>
        <div class="rt"><span class="quiet">Always</span></div></div>
      <div class="set"><div class="bd"><div class="t">Companies at your college's drives</div>
        <div class="d">See your resume and details only for drives you applied to</div></div>
        <div class="rt"><span class="quiet">On applying</span></div></div>
      <div class="set"><div class="bd"><div class="t">Anyone outside your college</div>
        <div class="d">Off. If you ever turn this on you choose exactly what is shared, you can turn it off again, and you'll see who looked.</div></div>
        <div class="rt"><label class="sw" for="cs"><input type="checkbox" id="cs"><i></i></label></div></div>
    </div></div>
    <p class="quiet">Your college turning on a Pro feature does not turn this on. Only you can.</p>`}`;}

const VIEWS={"#/today":Today,"#/planner":Planner,"#/drives":Drives,"#/drive":Drive,"#/companies":Companies,
  "#/students":Students,"#/analytics":Analytics,"#/settings":Settings,
  "#/cr":CR,"#/juniors":Juniors,"#/xp":XP,
  "#/home":Home,"#/mydrives":MyDrives,"#/premium":Premium,"#/profile":Profile,
  "#/jhome":JHome,"#/prep":Prep};

function render(){
  const allowed=NAV[role].map(x=>x[0]).concat(role==="admin"?["#/drive"]:[]);
  if(!allowed.includes(route)) route=HOME[role];
  document.documentElement.setAttribute("data-role",role);
  rail();
  el("view").innerHTML=(VIEWS[route]||Today)();
  el("view").querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{TAB[route]=b.dataset.tab;render();}));
  if(route==="#/drives"){el("view").querySelectorAll(".drive .rt .btn").forEach(b=>b.addEventListener("click",()=>{location.hash="#/drive";}));}
  if(route==="#/drive"){el("view").querySelectorAll(".stage").forEach(s=>{
    const go=()=>{openStage=openStage===+s.dataset.stage?-1:+s.dataset.stage;render();};
    s.addEventListener("click",go);
    s.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});});}
  window.scrollTo({top:0});
}
function setRole(r){
  role=r;
  document.querySelectorAll("#roleseg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.role===r)));
  route=HOME[r];history.replaceState(null,"",route);render();
}
function setTheme(t){
  theme=t;document.documentElement.setAttribute("data-theme",t);
  el("th-dark").setAttribute("aria-pressed",String(t==="dark"));
  el("th-light").setAttribute("aria-pressed",String(t==="light"));
}
document.querySelectorAll("#roleseg button").forEach(b=>b.addEventListener("click",()=>setRole(b.dataset.role)));
el("th-dark").addEventListener("click",()=>setTheme("dark"));
el("th-light").addEventListener("click",()=>setTheme("light"));
window.addEventListener("hashchange",()=>{route=location.hash||HOME[role];render();});
setTheme("dark");
document.documentElement.setAttribute("data-role","admin");
route=location.hash||"#/today";
render();
</script>
